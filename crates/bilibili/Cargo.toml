[package]
name = "rigili_bilibili"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
rigili_macro.workspace = true
rigili_monitor.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
hex = "0.4"
md-5 = "0.10"
percent-encoding = "2"
brotli = "9"
flate2 = "1"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["brotli", "cookies", "gzip", "rustls-tls"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }