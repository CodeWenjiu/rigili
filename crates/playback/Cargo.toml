[package]
name = "rigili_playback"
version.workspace = true
edition.workspace = true
publish = false

[features]
video-monitor = ["rigili_monitor/video-monitor"]

[dependencies]
gpui-kit.workspace = true
raw-window-handle = "0.6"
rigili_bilibili.workspace = true
rigili_core.workspace = true
rigili_macro.workspace = true
rigili_monitor.workspace = true
rigili_player.workspace = true
serde.workspace = true
serde_json.workspace = true
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
image = { version = "0.25", default-features = false }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
