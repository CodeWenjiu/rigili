[package]
name = "rigili_app"
version.workspace = true
edition.workspace = true
publish = false

[features]
video-monitor = ["rigili_playback/video-monitor"]

[[bin]]
name = "rigili"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
rigili_bilibili.workspace = true
rigili_core.workspace = true
rigili_macro.workspace = true
rigili_playback.workspace = true
rigili_player.workspace = true
anyhow.workspace = true
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "rustls-tls"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
image = { version = "0.25", default-features = false }
qrcodegen = "1"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }