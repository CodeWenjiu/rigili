[package]
name = "rigili_app"
version.workspace = true
edition.workspace = true
publish = false

[features]
video-monitor = [
    "rigili_monitor/video-monitor",
    "rigili_playback/video-monitor",
    "dep:tracing",
    "dep:tracing-appender",
    "dep:tracing-subscriber",
]

[[bin]]
name = "rigili"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
rigili_bilibili.workspace = true
rigili_core.workspace = true
rigili_macro.workspace = true
rigili_monitor.workspace = true
rigili_playback.workspace = true
rigili_player.workspace = true
anyhow.workspace = true
log.workspace = true
libmimalloc-sys.workspace = true
libc.workspace = true
mimalloc.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing = { workspace = true, optional = true }
tracing-appender = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "rustls-tls"] }
tokio = { workspace = true, features = ["rt-multi-thread", "sync"] }
image = { version = "0.25", default-features = false }
qrcodegen = "1"

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }