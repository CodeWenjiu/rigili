[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[profile.dev]
debug = "line-tables-only"

[workspace.dependencies]
gpui-kit = { version = "0.9.1", features = ["gpui-fast"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
rigili_macro = { path = "crates/macro" }
rigili_bilibili = { path = "crates/bilibili" }
rigili_core = { path = "crates/core" }
rigili_playback = { path = "crates/playback" }
rigili_player = { path = "crates/player" }